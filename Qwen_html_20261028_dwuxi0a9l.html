<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Textos - Acceso Seguro</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            transition: all 0.3s ease;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        input[type="email"],
        input[type="password"],
        input[type="file"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-secondary {
            background-color: var(--bg);
            color: var(--text);
            border: 2px solid var(--border);
            margin-top: 0.5rem;
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
            min-height: 1.25rem;
        }

        .hidden {
            display: none !important;
        }

        /* Dashboard Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-admin {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .badge-local {
            background-color: #dcfce7;
            color: #166534;
        }

        .upload-section {
            background-color: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .file-list {
            list-style: none;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            background-color: white;
            transition: box-shadow 0.2s;
        }

        .file-item:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .file-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-date {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .file-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .btn-download {
            background-color: var(--success);
            color: white;
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            border-radius: 8px;
        }

        .btn-download:hover {
            background-color: #15803d;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Sección de Login -->
    <div id="login-container" class="container">
        <h1>🔐 Acceso al Sistema</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="ej. local@local.es">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="login-btn">Iniciar Sesión</button>
            <button type="button" class="btn-secondary" id="register-btn">Registrarse (Solo cuentas autorizadas)</button>
            <div class="error-msg" id="login-error"></div>
        </form>
    </div>

    <!-- Sección de la Aplicación (Dashboard) -->
    <div id="app-container" class="container hidden">
        <div class="header">
            <div>
                <h2 style="margin-bottom: 0.25rem; text-align: left;">Panel de Control</h2>
                <span id="user-email" style="color: var(--text-light); font-size: 0.9rem;"></span>
            </div>
            <div style="text-align: right;">
                <span id="role-badge" class="badge"></span>
                <button id="logout-btn" class="btn-secondary" style="width: auto; padding: 0.5rem 1rem; margin-top: 0.5rem; font-size: 0.875rem;">Cerrar Sesión</button>
            </div>
        </div>

        <!-- Sección de Subida (Solo Administrador) -->
        <div id="admin-section" class="upload-section hidden">
            <h3 style="margin-bottom: 1rem;">📤 Subir Nuevo Archivo</h3>
            <div class="form-group">
                <input type="file" id="file-input">
            </div>
            <button id="upload-btn" class="btn-primary">Subir Archivo</button>
            <div class="error-msg" id="upload-error"></div>
        </div>

        <!-- Lista de Archivos -->
        <h3 style="margin-bottom: 1rem;">📁 Archivos Disponibles</h3>
        <ul id="file-list" class="file-list">
            <!-- Los archivos se cargarán aquí dinámicamente -->
        </ul>
        <div id="loading-files" style="text-align: center; color: var(--text-light); padding: 2rem;">
            <div class="spinner" style="border-top-color: var(--primary); width: 1.5rem; height: 1.5rem;"></div>
            <p style="margin-top: 0.5rem;">Cargando archivos...</p>
        </div>
    </div>

    <!-- Lógica de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getStorage, 
            ref, 
            uploadBytes, 
            getDownloadURL, 
            listAll, 
            deleteObject 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Configuración proporcionada
        const firebaseConfig = {
            apiKey: "AIzaSyBmTBMyE7Y_LgSXH1SrmEv29DLYdxkyUEw",
            authDomain: "compartir-textos-app.firebaseapp.com",
            projectId: "compartir-textos-app",
            storageBucket: "compartir-textos-app.firebasestorage.app",
            messagingSenderId: "705083380628",
            appId: "1:705083380628:web:ce267570e09e3ef1b27581",
            measurementId: "G-8GH28F0YJ0"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const storage = getStorage(app);

        // Constantes de seguridad
        const ALLOWED_EMAILS = ['local@local.es', 'administrador@administrador.es'];
        const ADMIN_EMAIL = 'administrador@administrador.es';

        // Elementos del DOM
        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const uploadError = document.getElementById('upload-error');
        const userEmailSpan = document.getElementById('user-email');
        const roleBadge = document.getElementById('role-badge');
        const adminSection = document.getElementById('admin-section');
        const fileList = document.getElementById('file-list');
        const loadingFiles = document.getElementById('loading-files');

        let currentUser = null;
        let isAdmin = false;

        // Función para validar correo
        function isAllowedEmail(email) {
            return ALLOWED_EMAILS.includes(email.toLowerCase().trim());
        }

        // Mostrar/Ocultar carga en botones
        function setLoading(buttonId, isLoading, text) {
            const btn = document.getElementById(buttonId);
            if (isLoading) {
                btn.classList.add('loading');
                btn.innerHTML = `<span class="spinner"></span> ${text}`;
            } else {
                btn.classList.remove('loading');
                btn.innerHTML = text;
            }
        }

        // Iniciar Sesión
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            loginError.textContent = '';

            if (!isAllowedEmail(email)) {
                loginError.textContent = '❌ Acceso denegado: Este correo no está autorizado.';
                return;
            }

            setLoading('login-btn', true, 'Iniciando sesión...');
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    loginError.textContent = '❌ Correo o contraseña incorrectos.';
                } else {
                    loginError.textContent = `❌ Error: ${error.message}`;
                }
            } finally {
                setLoading('login-btn', false, 'Iniciar Sesión');
            }
        });

        // Registrarse (Con restricción estricta)
        document.getElementById('register-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            loginError.textContent = '';

            if (!isAllowedEmail(email)) {
                loginError.textContent = '❌ Registro denegado: Solo se permiten las cuentas locales y de administrador.';
                return;
            }

            if (password.length < 6) {
                loginError.textContent = '❌ La contraseña debe tener al menos 6 caracteres.';
                return;
            }

            setLoading('register-btn', true, 'Registrando...');
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert(`✅ Cuenta ${email} creada exitosamente. Ya puedes iniciar sesión.`);
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    loginError.textContent = '⚠️ Esta cuenta ya existe. Por favor, inicia sesión.';
                } else {
                    loginError.textContent = `❌ Error al registrar: ${error.message}`;
                }
            } finally {
                setLoading('register-btn', false, 'Registrarse (Solo cuentas autorizadas)');
            }
        });

        // Cerrar Sesión
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // Escuchar cambios de autenticación
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Doble verificación de seguridad
                if (!isAllowedEmail(user.email)) {
                    await signOut(auth);
                    loginError.textContent = '❌ Sesión cerrada: Cuenta no autorizada.';
                    return;
                }

                currentUser = user;
                isAdmin = (user.email.toLowerCase() === ADMIN_EMAIL);

                // Actualizar UI
                loginContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userEmailSpan.textContent = user.email;
                
                if (isAdmin) {
                    roleBadge.textContent = 'Administrador';
                    roleBadge.className = 'badge badge-admin';
                    adminSection.classList.remove('hidden');
                } else {
                    roleBadge.textContent = 'Usuario Local';
                    roleBadge.className = 'badge badge-local';
                    adminSection.classList.add('hidden');
                }

                // Cargar archivos
                loadFiles();
            } else {
                currentUser = null;
                isAdmin = false;
                loginContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        });

        // Subir Archivo (Solo Admin)
        document.getElementById('upload-btn').addEventListener('click', async () => {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            uploadError.textContent = '';

            if (!file) {
                uploadError.textContent = '⚠️ Por favor, selecciona un archivo primero.';
                return;
            }

            if (!isAdmin) {
                uploadError.textContent = '❌ No tienes permisos para subir archivos.';
                return;
            }

            setLoading('upload-btn', true, 'Subiendo...');
            try {
                // Usar el nombre original del archivo o añadir timestamp para evitar colisiones
                const fileName = `${Date.now()}_${file.name}`;
                const storageRef = ref(storage, `uploads/${fileName}`);
                
                await uploadBytes(storageRef, file);
                
                fileInput.value = ''; // Limpiar input
                uploadError.textContent = '✅ Archivo subido correctamente.';
                uploadError.style.color = 'var(--success)';
                
                setTimeout(() => {
                    uploadError.textContent = '';
                    uploadError.style.color = 'var(--danger)';
                }, 3000);

                loadFiles(); // Recargar lista
            } catch (error) {
                console.error(error);
                uploadError.textContent = `❌ Error al subir: ${error.message}`;
            } finally {
                setLoading('upload-btn', false, 'Subir Archivo');
            }
        });

        // Cargar Lista de Archivos
        async function loadFiles() {
            loadingFiles.classList.remove('hidden');
            fileList.innerHTML = '';

            try {
                const listRef = ref(storage, 'uploads/');
                const res = await listAll(listRef);
                
                loadingFiles.classList.add('hidden');

                if (res.items.length === 0) {
                    fileList.innerHTML = '<li style="text-align: center; color: var(--text-light); padding: 2rem;">No hay archivos disponibles aún.</li>';
                    return;
                }

                // Ordenar por nombre (que incluye timestamp) de más reciente a más antiguo
                res.items.sort((a, b) => b.name.localeCompare(a.name));

                for (const itemRef of res.items) {
                    const url = await getDownloadURL(itemRef);
                    const fileName = itemRef.name.replace(/^\d+_/, ''); // Quitar timestamp para mostrar nombre limpio
                    
                    const li = document.createElement('li');
                    li.className = 'file-item';
                    
                    const actionsHtml = isAdmin 
                        ? `<button class="btn-danger" onclick="deleteFile('${itemRef.name}')">Eliminar</button>` 
                        : '';

                    li.innerHTML = `
                        <div class="file-info">
                            <span class="file-name">${fileName}</span>
                            <span class="file-date">Listo para descargar</span>
                        </div>
                        <div class="file-actions">
                            <a href="${url}" target="_blank" class="btn-download" download="${fileName}">Descargar</a>
                            ${actionsHtml}
                        </div>
                    `;
                    fileList.appendChild(li);
                }
            } catch (error) {
                console.error(error);
                loadingFiles.classList.add('hidden');
                fileList.innerHTML = `<li style="text-align: center; color: var(--danger); padding: 2rem;">Error al cargar archivos: ${error.message}</li>`;
            }
        }

        // Eliminar Archivo (Solo Admin) - Exponer globalmente para el onclick del HTML
        window.deleteFile = async function(fileName) {
            if (!isAdmin) return;
            if (!confirm(`¿Estás seguro de que deseas eliminar "${fileName}" permanentemente?`)) return;

            try {
                const fileRef = ref(storage, `uploads/${fileName}`);
                await deleteObject(fileRef);
                loadFiles(); // Recargar lista
            } catch (error) {
                console.error(error);
                alert(`Error al eliminar: ${error.message}`);
            }
        };
    </script>
</body>
</html>
