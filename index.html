<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Textos - Acceso Seguro</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 600px; padding: 2rem; }
        h1, h2 { text-align: center; margin-bottom: 1.5rem; color: var(--text); }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--text-light); }
        input[type="email"], input[type="password"], input[type="file"] { width: 100%; padding: 0.75rem 1rem; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 0.875rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); color: white; width: auto; padding: 0.5rem 1rem; font-size: 0.875rem; }
        .btn-secondary { background-color: var(--bg); color: var(--text); border: 2px solid var(--border); margin-top: 0.5rem; }
        .btn-secondary:hover:not(:disabled) { background-color: var(--border); }
        .btn-test { background-color: #f59e0b; color: white; margin-top: 0.5rem; font-size: 0.9rem; }
        .error-msg { color: var(--danger); font-size: 0.875rem; text-align: center; margin-top: 1rem; min-height: 1.25rem; white-space: pre-wrap; }
        .success-msg { color: var(--success); font-size: 0.875rem; text-align: center; margin-top: 1rem; }
        .hidden { display: none !important; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 2px solid var(--border); }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-admin { background-color: #dbeafe; color: #1e40af; }
        .badge-local { background-color: #dcfce7; color: #166534; }
        .upload-section { background-color: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 1.5rem; text-align: center; margin-bottom: 2rem; }
        .progress-container { width: 100%; background-color: #e2e8f0; border-radius: 9999px; height: 16px; margin-top: 1rem; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s ease; border-radius: 9999px; }
        .progress-text { font-size: 0.875rem; color: var(--text-light); margin-top: 0.5rem; font-weight: 600; display: none; }
        .file-list { list-style: none; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.75rem; background-color: white; }
        .file-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; margin-right: 1rem; }
        .file-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
        .btn-download { background-color: var(--success); color: white; width: auto; padding: 0.5rem 1rem; font-size: 0.875rem; text-decoration: none; border-radius: 8px; border: none; }
        .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="login-container" class="container">
        <h1>🔐 Acceso al Sistema</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="local@local.es o administrador@administrador.es">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="login-btn">Iniciar Sesión</button>
            <button type="button" class="btn-secondary" id="register-btn">Registrarse</button>
            <div class="error-msg" id="login-error"></div>
        </form>
    </div>

    <div id="app-container" class="container hidden">
        <div class="header">
            <div>
                <h2 style="margin-bottom: 0.25rem; text-align: left;">Panel de Control</h2>
                <span id="user-email" style="color: var(--text-light); font-size: 0.9rem;"></span>
            </div>
            <div style="text-align: right;">
                <span id="role-badge" class="badge"></span>
                <button id="logout-btn" class="btn-secondary" style="width: auto; padding: 0.5rem 1rem; margin-top: 0.5rem; font-size: 0.875rem;">Cerrar Sesión</button>
            </div>
        </div>

        <div id="admin-section" class="upload-section hidden">
            <h3 style="margin-bottom: 1rem;">📤 Subir Nuevo Archivo</h3>
            
            <!-- Botón de diagnóstico -->
            <button id="test-connection-btn" class="btn-test">🔍 Probar Conexión a Storage</button>
            <div id="test-result" class="error-msg" style="margin-bottom: 1rem;"></div>

            <div class="form-group">
                <input type="file" id="file-input">
            </div>
            <button id="upload-btn" class="btn-primary">Subir Archivo</button>
            
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">Preparando...</div>
            
            <div class="error-msg" id="upload-error"></div>
            <div class="success-msg" id="upload-success"></div>
        </div>

        <h3 style="margin-bottom: 1rem;">📁 Archivos Disponibles</h3>
        <ul id="file-list" class="file-list"></ul>
        <div id="loading-files" style="text-align: center; color: var(--text-light); padding: 2rem;">
            <div class="spinner" style="border-color: #e2e8f0; border-top-color: var(--primary); width: 1.5rem; height: 1.5rem;"></div>
            <p style="margin-top: 0.5rem;">Cargando archivos...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, listAll, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmTBMyE7Y_LgSXH1SrmEv29DLYdxkyUEw",
            authDomain: "compartir-textos-app.firebaseapp.com",
            projectId: "compartir-textos-app",
            // ⚠️ IMPORTANTE: Si tu bucket es .appspot.com, cámbialo aquí.
            storageBucket: "compartir-textos-app.firebasestorage.app", 
            messagingSenderId: "705083380628",
            appId: "1:705083380628:web:ce267570e09e3ef1b27581",
            measurementId: "G-8GH28F0YJ0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const storage = getStorage(app);

        const ALLOWED_EMAILS = ['local@local.es', 'administrador@administrador.es'];
        const ADMIN_EMAIL = 'administrador@administrador.es';

        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');
        const loginError = document.getElementById('login-error');
        const uploadError = document.getElementById('upload-error');
        const uploadSuccess = document.getElementById('upload-success');
        const adminSection = document.getElementById('admin-section');
        const fileList = document.getElementById('file-list');
        const loadingFiles = document.getElementById('loading-files');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const testResult = document.getElementById('test-result');

        let isAdmin = false;
        let uploadTask = null;
        let uploadTimeout = null;

        function setLoading(btnId, isLoading, text) {
            const btn = document.getElementById(btnId);
            btn.disabled = isLoading;
            btn.innerHTML = isLoading ? `<span class="spinner"></span> ${text}` : text;
        }

        function resetProgressUI() {
            progressContainer.style.display = 'none';
            progressText.style.display = 'none';
            progressBar.style.width = '0%';
            document.getElementById('file-input').disabled = false;
            setLoading('upload-btn', false, 'Subir Archivo');
            if (uploadTimeout) clearTimeout(uploadTimeout);
        }

        // --- DIAGNÓSTICO DE CONEXIÓN ---
        document.getElementById('test-connection-btn').addEventListener('click', async () => {
            testResult.textContent = 'Probando conexión...';
            testResult.style.color = 'var(--text-light)';
            try {
                const testRef = ref(storage, 'test_connection.txt');
                // Intentamos escribir un archivo tiny de prueba
                const blob = new Blob(["Prueba de conexión"], { type: 'text/plain' });
                await uploadBytesResumable(testRef, blob);
                await deleteObject(testRef); // Lo borramos inmediatamente
                testResult.textContent = '✅ ¡Conexión exitosa! Las reglas y el bucket están bien configurados.';
                testResult.style.color = 'var(--success)';
            } catch (error) {
                console.error("Fallo de diagnóstico:", error);
                let msg = '❌ Fallo de conexión.\n';
                if (error.code === 'storage/unauthorized') {
                    msg += 'Motivo: Las REGLAS DE FIREBASE STORAGE bloquean la escritura. Ve a Firebase Console > Storage > Rules y asegúrate de permitir write a tu email.';
                } else if (error.code === 'storage/object-not-found' || error.message.includes('bucket')) {
                    msg += 'Motivo: El nombre del "storageBucket" en la configuración es incorrecto o el bucket no existe.';
                } else if (error.message.includes('NetworkError') || error.message.includes('CORS')) {
                    msg += 'Motivo: Error de CORS o red. ¿Estás abriendo el archivo con doble clic (file://)? Usa un servidor local (VS Code Live Server) o súbelo a un hosting.';
                } else {
                    msg += `Motivo desconocido: ${error.message}`;
                }
                testResult.textContent = msg;
                testResult.style.color = 'var(--danger)';
            }
        });

        // --- LOGIN ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            loginError.textContent = '';

            if (!ALLOWED_EMAILS.includes(email)) {
                loginError.textContent = '❌ Acceso denegado: Correo no autorizado.';
                return;
            }

            setLoading('login-btn', true, 'Iniciando sesión...');
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginError.textContent = `❌ Error: ${error.message}`;
            } finally {
                setLoading('login-btn', false, 'Iniciar Sesión');
            }
        });

        document.getElementById('register-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            loginError.textContent = '';

            if (!ALLOWED_EMAILS.includes(email)) {
                loginError.textContent = '❌ Registro denegado: Solo cuentas autorizadas.';
                return;
            }

            setLoading('register-btn', true, 'Registrando...');
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert('✅ Cuenta creada. Ahora inicia sesión.');
            } catch (error) {
                loginError.textContent = `❌ Error: ${error.message}`;
            } finally {
                setLoading('register-btn', false, 'Registrarse');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user && ALLOWED_EMAILS.includes(user.email.toLowerCase())) {
                isAdmin = (user.email.toLowerCase() === ADMIN_EMAIL);
                loginContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                document.getElementById('user-email').textContent = user.email;
                
                document.getElementById('role-badge').textContent = isAdmin ? 'Administrador' : 'Usuario Local';
                document.getElementById('role-badge').className = `badge ${isAdmin ? 'badge-admin' : 'badge-local'}`;
                
                adminSection.classList.toggle('hidden', !isAdmin);
                loadFiles();
            } else {
                loginContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        });

        // --- SUBIDA CON DIAGNÓSTICO ---
        document.getElementById('upload-btn').addEventListener('click', () => {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            uploadError.textContent = '';
            uploadSuccess.textContent = '';

            if (!file) {
                uploadError.textContent = '⚠️ Selecciona un archivo primero.';
                return;
            }
            if (file.size > 50 * 1024 * 1024) {
                uploadError.textContent = '❌ Máximo 50 MB permitidos.';
                return;
            }

            progressContainer.style.display = 'block';
            progressText.style.display = 'block';
            progressText.textContent = 'Iniciando...';
            progressBar.style.width = '0%';
            fileInput.disabled = true;
            setLoading('upload-btn', true, 'Subiendo...');

            const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const storageRef = ref(storage, `uploads/${Date.now()}_${cleanName}`);
            
            uploadTask = uploadBytesResumable(storageRef, file);

            // Temporizador de seguridad: si en 15 segundos sigue en 0%, es problema de red/CORS
            uploadTimeout = setTimeout(() => {
                if (progressBar.style.width === '0%') {
                    uploadError.textContent = '⚠️ La subida está congelada en 0%. Esto suele ser un bloqueo CORS (abrir con doble clic) o un firewall. Abre la consola del navegador (F12) para ver el error exacto.';
                    resetProgressUI();
                }
            }, 15000);

            uploadTask.on('state_changed',
                (snapshot) => {
                    const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `Subiendo: ${progress}%`;
                },
                (error) => {
                    console.error("ERROR DETALLADO DE SUBIDA:", error);
                    resetProgressUI();
                    if (error.code === 'storage/unauthorized') {
                        uploadError.textContent = '❌ PERMISOS DENEGADOS. Ve a Firebase Console > Storage > Rules y asegúrate de tener la regla "allow write" configurada correctamente.';
                    } else if (error.code === 'storage/canceled') {
                        uploadError.textContent = '❌ Subida cancelada.';
                    } else {
                        uploadError.textContent = `❌ Error: ${error.message} (Código: ${error.code})`;
                    }
                },
                () => {
                    resetProgressUI();
                    uploadSuccess.textContent = '✅ ¡Archivo subido con éxito!';
                    fileInput.value = '';
                    setTimeout(() => { uploadSuccess.textContent = ''; }, 4000);
                    loadFiles();
                }
            );
        });

        async function loadFiles() {
            loadingFiles.classList.remove('hidden');
            fileList.innerHTML = '';
            try {
                const res = await listAll(ref(storage, 'uploads/'));
                loadingFiles.classList.add('hidden');
                if (res.items.length === 0) {
                    fileList.innerHTML = '<li style="text-align:center; color:var(--text-light); padding:2rem;">No hay archivos.</li>';
                    return;
                }
                res.items.sort((a, b) => b.name.localeCompare(a.name));
                for (const itemRef of res.items) {
                    const url = await getDownloadURL(itemRef);
                    const displayName = itemRef.name.replace(/^\d+_/, '').replace(/_/g, ' ');
                    const li = document.createElement('li');
                    li.className = 'file-item';
                    li.innerHTML = `
                        <div class="file-info">
                            <span class="file-name" title="${displayName}">${displayName}</span>
                        </div>
                        <div class="file-actions">
                            <a href="${url}" target="_blank" class="btn-download" download="${displayName}">Descargar</a>
                            ${isAdmin ? `<button class="btn-danger" onclick="deleteFile('${itemRef.name}')">Eliminar</button>` : ''}
                        </div>
                    `;
                    fileList.appendChild(li);
                }
            } catch (error) {
                console.error(error);
                loadingFiles.classList.add('hidden');
                fileList.innerHTML = `<li style="text-align:center; color:var(--danger); padding:2rem;">Error al cargar: ${error.message}</li>`;
            }
        }

        window.deleteFile = async function(fileName) {
            if (!isAdmin || !confirm('¿Eliminar permanentemente?')) return;
            try {
                await deleteObject(ref(storage, `uploads/${fileName}`));
                loadFiles();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        };
    </script>
</body>
</html>
